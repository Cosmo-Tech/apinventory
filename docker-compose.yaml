services:
  apinventory:
    # build: .
    image: ghcr.io/cosmo-tech/apinventory:latest
    restart: unless-stopped
    env_file: ".env"
    volumes:
      - ./vitepress/data/:/apiventory/_inventory/
      - ${PWD}/_kubeconfig:/apiventory/_kubeconfig
      - $HOME/.azure:/root/.azure

  vitepress-inventory:
    build:
      context: ./vitepress
      dockerfile: Dockerfile
    container_name: vitepress-inventory
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./vitepress/data:/app/data
